name: Sync Upstream Predbat Release

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'versions.env'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Let the running build finish; queue rather than kill

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_changed: ${{ steps.compare.outputs.changed }}
      new_version: ${{ steps.upstream.outputs.tag }}
      givtcp_version: ${{ steps.givtcp_version.outputs.givtcp_version }}
      addon_version: ${{ steps.addon_version.outputs.addon_version }}
      s6_version: ${{ steps.s6_version.outputs.s6_version }}
      commit_sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get latest upstream release tag
        id: upstream
        run: |
          set -euo pipefail
          LATEST=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/springfall2008/batpred/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to fetch latest upstream release tag"
            exit 1
          fi
          echo "Latest upstream release: $LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Read current version
        id: current
        run: |
          source versions.env
          PREDBAT_VERSION_CLEAN=$(echo "$PREDBAT_VERSION" | tr -d '[:space:]')
          echo "Current version: $PREDBAT_VERSION_CLEAN"
          echo "predbat_version=$PREDBAT_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Read givtcp version
        id: givtcp_version
        run: |
          source versions.env
          GIVTCP_VERSION_CLEAN=$(echo "$GIVTCP_VERSION" | tr -d '[:space:]')
          echo "GivTCP version: $GIVTCP_VERSION_CLEAN"
          echo "givtcp_version=$GIVTCP_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Read addon version
        id: addon_version
        run: |
          source versions.env
          ADDON_VERSION_CLEAN=$(echo "$ADDON_VERSION" | tr -d '[:space:]')
          echo "Addon version: $ADDON_VERSION_CLEAN"
          echo "addon_version=$ADDON_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Read s6 version
        id: s6_version
        run: |
          source versions.env
          S6_VERSION_CLEAN=$(echo "$S6_VERSION" | tr -d '[:space:]')
          echo "S6 version: $S6_VERSION_CLEAN"
          echo "s6_version=$S6_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.tag }}" != "${{ steps.current.outputs.predbat_version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version file
        if: steps.compare.outputs.changed == 'true'
        run: |
          sed -i "s/^PREDBAT_VERSION=.*/PREDBAT_VERSION=${{ steps.upstream.outputs.tag }}/" versions.env
          echo "Updated versions.env to ${{ steps.upstream.outputs.tag }}"

      - name: Commit and push updated version
        id: push
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.env
          git commit -m "chore: bump predbat version to ${{ steps.upstream.outputs.tag }}"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check-and-sync
    if: github.event_name == 'workflow_dispatch' || needs.check-and-sync.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      USER: ${{ secrets.DOCKERHUB_USERNAME }}
      PREDBAT_VERSION: ${{ needs.check-and-sync.outputs.new_version }}
      GIVTCP_VERSION: ${{ needs.check-and-sync.outputs.givtcp_version }}
      ADDON_VERSION: ${{ needs.check-and-sync.outputs.addon_version }}
      S6_VERSION: ${{ needs.check-and-sync.outputs.s6_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-and-sync.outputs.commit_sha || github.sha }}

      - name: Validate version
        run: |
          [ -n "${{ env.PREDBAT_VERSION }}" ] || { echo "Empty predbat version!"; exit 1; }
          [ -n "${{ env.GIVTCP_VERSION }}" ] || { echo "Empty givtcp version!"; exit 1; }
          [ -n "${{ env.ADDON_VERSION }}" ] || { echo "Empty addon version!"; exit 1; }
          [ -n "${{ env.S6_VERSION }}" ] || { echo "Empty s6 version!"; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "value=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.USER }}/predbat-givtcp-addon:latest
            ${{ env.USER }}/predbat-givtcp-addon:${{ env.PREDBAT_VERSION }}
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.value }}
            PREDBAT_VERSION=${{ env.PREDBAT_VERSION }}
            GIVTCP_VERSION=${{ env.GIVTCP_VERSION }}
            ADDON_VERSION=${{ env.ADDON_VERSION }}
            S6_VERSION=${{ env.S6_VERSION }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,scope=build,mode=max
          provenance: true
          sbom: true

  release:
    needs: [check-and-sync, build]
    if: github.event_name == 'workflow_dispatch' || needs.check-and-sync.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PREDBAT_VERSION: ${{ needs.check-and-sync.outputs.new_version }}
      GIVTCP_VERSION: ${{ needs.check-and-sync.outputs.givtcp_version }}
      ADDON_VERSION: ${{ needs.check-and-sync.outputs.addon_version }}

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.PREDBAT_VERSION }}
          name: Based on Predbat Version ${{ env.PREDBAT_VERSION }}
          body: |
            🔧 Built with predbat version `${{ env.PREDBAT_VERSION }}`
            🔌 Built with GivTCP version `${{ env.GIVTCP_VERSION }}`
            📦 Addon version `${{ env.ADDON_VERSION }}`
