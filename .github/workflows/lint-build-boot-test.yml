name: Lint, Build & Boot Test

on:
  # &paths/*paths keeps the pull_request and push trigger lists in sync
  pull_request:
    paths: &paths
      - 'Dockerfile'
      - 'rootfs/**'
      - 'requirements/**'
      - 'versions.env'
      - '.github/workflows/lint-build-boot-test.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile & scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint - Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Shellcheck rootfs scripts
        run: |
          shopt -s globstar nullglob
          files=(rootfs/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found, skipping"
            exit 0
          fi
          shellcheck "${files[@]}"

  build-and-boot:
    name: Build & boot test (${{ matrix.platform }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          # linux/arm64 runs under QEMU emulation on these amd64 runners, so
          # Predbat's startup takes much longer to reach the config-check prompt.
          - platform: linux/amd64
            boot_timeout: 120
          - platform: linux/arm64
            boot_timeout: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions.env
        id: versions
        run: |
          source versions.env
          {
            echo "predbat_version=$(echo "$PREDBAT_VERSION" | tr -d '[:space:]')"
            echo "givtcp_version=$(echo "$GIVTCP_VERSION" | tr -d '[:space:]')"
            echo "addon_version=$(echo "$ADDON_VERSION" | tr -d '[:space:]')"
            echo "s6_version=$(echo "$S6_VERSION" | tr -d '[:space:]')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: predbat-givtcp-addon-test:latest
          build-args: |
            PREDBAT_VERSION=${{ steps.versions.outputs.predbat_version }}
            GIVTCP_VERSION=${{ steps.versions.outputs.givtcp_version }}
            ADDON_VERSION=${{ steps.versions.outputs.addon_version }}
            S6_VERSION=${{ steps.versions.outputs.s6_version }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: Boot test
        run: |
          scripts/build-boot-test.sh \
            --tag predbat-givtcp-addon-test:latest \
            --platform ${{ matrix.platform }} \
            --timeout ${{ matrix.boot_timeout }}
